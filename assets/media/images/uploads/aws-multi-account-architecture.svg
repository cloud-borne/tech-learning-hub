<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title description">
  <title id="title">AWS multi-account and cross-account delivery architecture</title>
  <desc id="description">AWS Organizations and Control Tower govern security, infrastructure, and workload accounts. IAM Identity Center provides workforce access. A tooling account builds and scans artifacts, then deploys to non-production and production accounts through constrained roles.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10z" fill="#566475"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #172b3a; }
      .title { font-size: 30px; font-weight: 700; }
      .label { font-size: 19px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 14px; }
      .box { stroke-width: 2; rx: 12; }
      .arrow { fill: none; stroke: #566475; stroke-width: 3; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect width="1440" height="920" fill="#f5f7f6"/>
  <text class="title" x="48" y="56">A governed AWS multi-account delivery platform</text>
  <text class="body" x="48" y="86">Separate blast radii. Centralize guardrails. Promote one verified artifact across accounts.</text>

  <rect class="box" x="48" y="120" width="1344" height="390" fill="#ffffff" stroke="#9aabb5"/>
  <rect x="48" y="120" width="1344" height="62" rx="12" fill="#173f52"/>
  <path d="M48 170h1344v12H48z" fill="#173f52"/>
  <text x="76" y="159" fill="#ffffff" font-size="22" font-weight="700">AWS Organizations + Control Tower</text>
  <text x="1360" y="158" fill="#d7e8ed" font-size="15" text-anchor="end">SCP guardrails · Account Factory · organization controls</text>

  <rect class="box" x="76" y="210" width="290" height="260" fill="#e8f2f3" stroke="#5e91a0"/>
  <text class="label" x="98" y="245">Security OU</text>
  <rect class="box" x="98" y="270" width="246" height="72" fill="#ffffff" stroke="#78a7b1"/>
  <text class="body" x="221" y="300" text-anchor="middle" font-weight="700">Security account</text>
  <text class="small" x="221" y="323" text-anchor="middle">Audit · delegated security tools</text>
  <rect class="box" x="98" y="365" width="246" height="72" fill="#ffffff" stroke="#78a7b1"/>
  <text class="body" x="221" y="395" text-anchor="middle" font-weight="700">Log archive account</text>
  <text class="small" x="221" y="418" text-anchor="middle">Central, restricted audit logs</text>

  <rect class="box" x="394" y="210" width="290" height="260" fill="#f0f1e4" stroke="#9b9b59"/>
  <text class="label" x="416" y="245">Infrastructure OU</text>
  <rect class="box" x="416" y="270" width="246" height="72" fill="#ffffff" stroke="#a8a36a"/>
  <text class="body" x="539" y="300" text-anchor="middle" font-weight="700">Shared services</text>
  <text class="small" x="539" y="323" text-anchor="middle">Approved common capabilities</text>
  <rect class="box" x="416" y="365" width="246" height="72" fill="#ffffff" stroke="#a8a36a"/>
  <text class="body" x="539" y="395" text-anchor="middle" font-weight="700">Tooling account</text>
  <text class="small" x="539" y="418" text-anchor="middle">Pipeline · build · encrypted artifacts</text>

  <rect class="box" x="712" y="210" width="650" height="260" fill="#edf3e9" stroke="#789467"/>
  <text class="label" x="734" y="245">Workloads OU</text>
  <rect class="box" x="736" y="270" width="276" height="154" fill="#ffffff" stroke="#86a27b"/>
  <text class="body" x="874" y="305" text-anchor="middle" font-weight="700">Non-production accounts</text>
  <text class="small" x="874" y="334" text-anchor="middle">Dev · test · staging</text>
  <text class="small" x="874" y="366" text-anchor="middle">Deploy role scoped to workload</text>
  <text class="small" x="874" y="391" text-anchor="middle">Verify health before promotion</text>
  <rect class="box" x="1042" y="270" width="294" height="154" fill="#ffffff" stroke="#86a27b"/>
  <text class="body" x="1189" y="305" text-anchor="middle" font-weight="700">Production accounts</text>
  <text class="small" x="1189" y="334" text-anchor="middle">Owned by workload / team</text>
  <text class="small" x="1189" y="366" text-anchor="middle">Approval + least-privilege role</text>
  <text class="small" x="1189" y="391" text-anchor="middle">Canary · alarms · recovery plan</text>
  <text class="small" x="1048" y="453" text-anchor="middle">Separate by ownership, environment, or risk where it adds a useful boundary.</text>

  <rect class="box" x="48" y="555" width="260" height="130" fill="#e5edf4" stroke="#6c91aa"/>
  <text class="label" x="178" y="590" text-anchor="middle">Workforce identity</text>
  <text class="body" x="178" y="621" text-anchor="middle">IAM Identity Center</text>
  <text class="small" x="178" y="649" text-anchor="middle">Groups → permission sets → accounts</text>
  <path class="arrow" d="M308 620H365V516"/>
  <text class="small" x="325" y="603">Temporary access</text>

  <rect class="box" x="394" y="555" width="968" height="250" fill="#ffffff" stroke="#9aabb5"/>
  <text class="label" x="420" y="590">Cross-account CI/CD · runs in the tooling account</text>
  <rect class="box" x="422" y="620" width="190" height="95" fill="#e8f2f3" stroke="#5e91a0"/>
  <text class="body" x="517" y="656" text-anchor="middle" font-weight="700">Source + review</text>
  <text class="small" x="517" y="685" text-anchor="middle">Protected changes</text>
  <rect class="box" x="662" y="620" width="190" height="95" fill="#f0f1e4" stroke="#9b9b59"/>
  <text class="body" x="757" y="656" text-anchor="middle" font-weight="700">Build + scan</text>
  <text class="small" x="757" y="685" text-anchor="middle">Tests · IaC · dependencies</text>
  <rect class="box" x="902" y="620" width="190" height="95" fill="#f7eee2" stroke="#bd8a50"/>
  <text class="body" x="997" y="656" text-anchor="middle" font-weight="700">Artifact + KMS</text>
  <text class="small" x="997" y="685" text-anchor="middle">Versioned · immutable</text>
  <rect class="box" x="1142" y="620" width="190" height="95" fill="#edf3e9" stroke="#789467"/>
  <text class="body" x="1237" y="656" text-anchor="middle" font-weight="700">Assume deploy role</text>
  <text class="small" x="1237" y="685" text-anchor="middle">Non-prod → approval → prod</text>
  <path class="arrow" d="M612 667H656"/>
  <path class="arrow" d="M852 667H896"/>
  <path class="arrow" d="M1092 667H1136"/>
  <path class="arrow dashed" d="M1237 620V510"/>
  <text class="small" x="1252" y="552">STS role assumption</text>

  <rect x="48" y="842" width="1344" height="42" rx="8" fill="#e8eceb"/>
  <text class="small" x="720" y="869" text-anchor="middle">Central visibility: organization CloudTrail / Config data → log archive and security workflows</text>
  <path class="arrow dashed" d="M221 470V820H178V836"/>
  <path class="arrow dashed" d="M539 470V820H720V836"/>
</svg>